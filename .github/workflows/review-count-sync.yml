name: Nightly Review Count Sync

# Keeps the JSON-LD aggregateRating (reviewCount + ratingValue) in the built
# HTML current with the live Google count. The count is baked into static HTML
# at build time (src/lib/reviewStats.mjs fetches /api/reviews.php), and the
# Cloudways deploy only serves committed HTML — so refreshing it requires a
# rebuild + commit + deploy, which is exactly what this job does, but ONLY when
# the number has actually changed (no empty daily commits).
#
# Visible on-page counters already refresh in the browser on every page load;
# this job is solely about the server-rendered schema Googlebot reads.

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily (~2-3am US Central) — low-traffic window
  workflow_dispatch:        # allow manual runs from the Actions tab

# Let the default GITHUB_TOKEN push the rebuilt HTML back to main.
permissions:
  contents: write

# Never let two syncs overlap.
concurrency:
  group: review-count-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Rebuild schema count and deploy if changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Capture current schema count
        id: before
        run: |
          # Just the two integers/decimals from the business aggregateRating.
          # Plain values (no quotes) so they can never break the later compare.
          BEFORE_COUNT=$(grep -oE '"reviewCount":"[0-9]+"' index.html | head -1 | grep -oE '[0-9]+' || echo "0")
          BEFORE_RATING=$(grep -oE '"aggregateRating":\{"@type":"AggregateRating","ratingValue":"[0-9.]+"' index.html | head -1 | grep -oE '[0-9.]+' | tail -1 || echo "0")
          echo "count=$BEFORE_COUNT"   >> "$GITHUB_OUTPUT"
          echo "rating=$BEFORE_RATING" >> "$GITHUB_OUTPUT"
          echo "Before build: count=$BEFORE_COUNT rating=$BEFORE_RATING"

      - name: Build (fetches live Google count into the schema)
        run: npm run build

      - name: Compare and, if changed, commit + push + deploy
        id: sync
        # Pass prior values as env vars, never interpolated into the script body.
        env:
          BEFORE_COUNT: ${{ steps.before.outputs.count }}
          BEFORE_RATING: ${{ steps.before.outputs.rating }}
        run: |
          AFTER_COUNT=$(grep -oE '"reviewCount":"[0-9]+"' index.html | head -1 | grep -oE '[0-9]+' || echo "0")
          AFTER_RATING=$(grep -oE '"aggregateRating":\{"@type":"AggregateRating","ratingValue":"[0-9.]+"' index.html | head -1 | grep -oE '[0-9.]+' | tail -1 || echo "0")
          echo "After build:  count=$AFTER_COUNT rating=$AFTER_RATING"
          if [ "$AFTER_COUNT" = "$BEFORE_COUNT" ] && [ "$AFTER_RATING" = "$BEFORE_RATING" ]; then
            echo "Review count/rating unchanged — nothing to deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed: count ${BEFORE_COUNT}->${AFTER_COUNT}, rating ${BEFORE_RATING}->${AFTER_RATING}. Committing."
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(seo): sync schema reviewCount to live Google total (${AFTER_COUNT} reviews)"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push does not trigger the deploy.yml workflow, so deploy
      # inline here — same server command deploy.yml runs. Scoped strictly to
      # the website app directory; touches nothing else on the server.
      - name: Deploy to Cloudways
        if: steps.sync.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== NIGHTLY REVIEW-COUNT SYNC DEPLOY ==="
            cd /home/master/applications/btfdkcdpdw/public_html
            git fetch origin main
            git reset --hard origin/main
            git status
