name: Verify website and release approved booking page
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_booking_page:
        description: Publish Book Online only after Dispatch photo migration is live
        type: boolean
        default: false
permissions:
  contents: write   # the bot commits the CI-built root HTML back to main on push
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/booking-photo.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_release*.py'
      # Build in CI (Linux) so the committed HTML is byte-identical from deploy
      # to deploy: a local build's lightningcss output differs per OS and used
      # to churn every page. The server serves the committed root HTML, so on a
      # push the bot commits the refreshed output back (CLAUDE.md rule 1). A
      # push made with GITHUB_TOKEN does not re-trigger this workflow, so there
      # is no loop. The booking-page workflow_dispatch path below never commits.
      - run: npm run build
      - name: Commit refreshed build output (push events only)
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(build): CI build output for ${GITHUB_SHA:0:7}"
            git push origin main
            echo "Committed and pushed refreshed build output."
          else
            echo "Build output unchanged - nothing to commit."
          fi
      - name: Prepare exact public-page release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_booking_page
        id: bundle
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, zlib
          from pathlib import Path
          page = Path('dist/book-online/index.html').read_bytes()
          page += ('\n<!-- booking-release:' + os.environ['GITHUB_SHA'] + ' -->\n').encode()
          assets = sorted(set(re.findall(r'/_astro/[A-Za-z0-9_.-]+', page.decode())))
          bundle = {'page': base64.b64encode(zlib.compress(page)).decode(), 'sha256': hashlib.sha256(page).hexdigest(), 'commit': os.environ['GITHUB_SHA'], 'assets': {p.lstrip('/'): hashlib.sha256(Path('dist' + p).read_bytes()).hexdigest() for p in assets}}
          script = base64.b64encode(Path('scripts/release-booking-page.py').read_bytes()).decode()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('bundle=' + base64.b64encode(json.dumps(bundle).encode()).decode() + '\n')
              output.write('script=' + script + '\n')
              output.write('sha256=' + bundle['sha256'] + '\n')
          PY
      - name: Backup verify and publish only booking HTML
        if: github.event_name == 'workflow_dispatch' && inputs.publish_booking_page
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            python3 -c "import base64; exec(compile(base64.b64decode('${{ steps.bundle.outputs.script }}'), '<approved-booking-release>', 'exec'))" '${{ steps.bundle.outputs.bundle }}'
      - name: Verify live public page
        if: github.event_name == 'workflow_dispatch' && inputs.publish_booking_page
        env:
          EXPECTED: ${{ steps.bundle.outputs.sha256 }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "https://armstronglocksmithinc.com/book-online/?release=${GITHUB_SHA}" -o /tmp/booking-live.html
          grep -Fq "booking-release:${GITHUB_SHA}" /tmp/booking-live.html
          grep -Fq 'photo_received' /tmp/booking-live.html
      - name: Deploy website to Cloudways btfdkcdpdw
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.publish_booking_page)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "=== AUTO DEPLOYING ARMSTRONG-ASTRO WEBSITE EXCLUSIVELY TO btfdkcdpdw ==="
            cd /home/master/applications/btfdkcdpdw/public_html
            git fetch origin main
            git reset --hard origin/main
            git status

            echo "=== PURGING LOCAL VARNISH CACHE ==="
            curl -s -X PURGE "http://127.0.0.1/" -H "Host: armstronglocksmithinc.com" || true
            curl -s -X BAN "http://127.0.0.1/.*" -H "Host: armstronglocksmithinc.com" || true
            echo "Website deploy complete!"
