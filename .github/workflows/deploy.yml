name: Auto Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudways Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            set -e
            git config --global --add safe.directory "*"
            cd /home/master/applications/btfdkcdpdw/public_html
            
            echo "=== CURRENT GIT STATUS ==="
            git fetch origin main
            git reset --hard origin/main
            git status
            
            echo "=== PURGING LOCAL VARNISH CACHE ==="
            curl -s -X PURGE "http://127.0.0.1/" -H "Host: armstronglocksmithinc.com" || true
            curl -s -X BAN "http://127.0.0.1/.*" -H "Host: armstronglocksmithinc.com" || true

            echo "=== CHECKING ALL APPLICATIONS ON SERVER ==="
            ls -la /home/master/applications/ || true
            for app in /home/master/applications/*; do
              echo "--- App: $app ---"
              ls -la "$app" 2>/dev/null || true
            done

            echo "=== CHECKING RUNNING ARTISAN / DAEMON PROCESSES ==="
            ps aux | grep -E "artisan|php|supervisor|queue" | grep -v grep || echo "No background php/artisan processes"
