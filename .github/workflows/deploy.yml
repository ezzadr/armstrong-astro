name: Auto Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudways Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            set -e
            git config --global --add safe.directory "*"
            cd /home/master/applications/btfdkcdpdw/public_html
            
            echo "=== CURRENT GIT STATUS ==="
            git fetch origin main
            git reset --hard origin/main
            git status
            
            echo "=== PURGING LOCAL VARNISH CACHE ==="
            curl -s -X PURGE "http://127.0.0.1/" -H "Host: armstronglocksmithinc.com" || true
            curl -s -X BAN "http://127.0.0.1/.*" -H "Host: armstronglocksmithinc.com" || true

            echo "=== RESTORING ARMSTRONG AI CALL DISPATCH IN jqkvdrpcfz ==="
            cd /home/master/applications/jqkvdrpcfz/public_html
            if [ -f .env ]; then
              cp .env /tmp/jqkvdrpcfz_env_backup
            fi
            
            git remote set-url origin git@github.com-dispatch:ezzadr/armstrong-ai-call-dispatch.git 2>/dev/null || git remote add origin git@github.com-dispatch:ezzadr/armstrong-ai-call-dispatch.git
            git fetch origin main
            git reset --hard origin/main
            
            if [ -f /tmp/jqkvdrpcfz_env_backup ]; then
              cp /tmp/jqkvdrpcfz_env_backup .env
            fi

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader || true
            php artisan optimize:clear || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            php artisan migrate --force || true
            
            echo "=== DISPATCH APP RESTORE STATUS ==="
            git log -n 1
            php artisan --version || true

            echo "=== RESTORING ARMSTRONG PORTAL IN hrfzwcjvqh ==="
            cd /home/master/applications/hrfzwcjvqh/public_html
            if [ -f .env ]; then
              cp .env /tmp/hrfzwcjvqh_env_backup
            fi
            
            git remote set-url origin git@github.com-portal:ezzadr/armstrong-portal.git 2>/dev/null || git remote add origin git@github.com-portal:ezzadr/armstrong-portal.git
            git fetch origin main
            git reset --hard origin/main
            
            if [ -f /tmp/hrfzwcjvqh_env_backup ]; then
              cp /tmp/hrfzwcjvqh_env_backup .env
            fi

            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader || true
            php artisan optimize:clear || true
            php artisan config:cache || true
            php artisan route:cache || true
            php artisan view:cache || true
            
            echo "=== PORTAL APP RESTORE STATUS ==="
            git log -n 1
            php artisan --version || true
