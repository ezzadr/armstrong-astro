name: Auto Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudways Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            set -e
            git config --global --add safe.directory "*"
            cd /home/master/applications/btfdkcdpdw/public_html
            
            echo "=== CURRENT GIT STATUS ==="
            git fetch origin main
            git reset --hard origin/main
            git status
            
            echo "=== PURGING LOCAL VARNISH CACHE ==="
            curl -s -X PURGE "http://127.0.0.1/" -H "Host: armstronglocksmithinc.com" || true
            curl -s -X BAN "http://127.0.0.1/.*" -H "Host: armstronglocksmithinc.com" || true

            echo "=== GENERATING DISPATCH SSH KEY ON SERVER ==="
            if [ ! -f ~/.ssh/id_dispatch ]; then
              ssh-keygen -t ed25519 -C "cloudways-dispatch-deploy" -f ~/.ssh/id_dispatch -N ""
            fi
            echo "DISPATCH_PUBLIC_KEY:"
            cat ~/.ssh/id_dispatch.pub

            echo "=== CONFIGURING SSH CONFIG FOR DISPATCH ==="
            cat << 'EOF' > ~/.ssh/config
Host github.com-portal
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519

Host github.com-dispatch
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_dispatch

Host github.com
    HostName github.com
    User git
    IdentityFile ~/.ssh/id_ed25519
EOF
            chmod 600 ~/.ssh/config
