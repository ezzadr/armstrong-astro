name: Build & Deploy to Cloudways

# Build happens HERE (Linux CI), not on a developer machine. This keeps the
# committed HTML byte-identical from deploy to deploy — a local build produced
# slightly different minified CSS (lightningcss native binary differs per OS),
# which used to make every page churn whenever a local build and a CI build
# alternated. Now every build is a CI build, so that never happens.
#
# Workflow for contributors: edit files under src/ (and public/), commit the
# SOURCE, and push. Do NOT run `npm run build` before committing — CI builds,
# commits the refreshed root HTML, and deploys. `npm run dev` / `npm run build`
# locally are still fine for previewing; just don't commit the build output.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys run at once; let each finish rather than cancel mid-deploy.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build in CI, then deploy to Cloudways
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build (astro build + sync dist to repo root)
        run: npm run build

      - name: Commit refreshed build output if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(build): CI build output for ${GITHUB_SHA:0:7}"
            git push origin main
            echo "Committed and pushed refreshed build output."
          else
            echo "Build output unchanged — nothing to commit."
          fi

      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== AUTO DEPLOYING ARMSTRONG-ASTRO WEBSITE ==="
            cd /home/master/applications/btfdkcdpdw/public_html
            git fetch origin main
            git reset --hard origin/main
            git status

            echo "=== CONFIGURING NGINX 404 HANDLING ==="
            # Write custom Nginx error page directive for this application only
            NGINX_CUSTOM_DIR="/home/master/applications/btfdkcdpdw/conf/nginx"
            if [ -d "$NGINX_CUSTOM_DIR" ]; then
              cat > "$NGINX_CUSTOM_DIR/custom_error_pages.conf" << 'NGINX_EOF'
            # Armstrong Locksmith — Custom 404 Error Page Handling
            # Serves /404-handler.php (which returns HTTP 404 + custom 404.html content)
            # instead of falling back to /index.html with HTTP 200
            error_page 404 /404-handler.php;
            location = /404-handler.php {
              internal;
              fastcgi_pass unix:/run/php/php-fpm.sock;
              fastcgi_param SCRIPT_FILENAME $document_root/404-handler.php;
              include fastcgi_params;
            }
            NGINX_EOF
              echo "Nginx custom 404 config written successfully"
            else
              echo "WARNING: Nginx custom config dir not found at $NGINX_CUSTOM_DIR"
              echo "404 handling relies on .htaccess ErrorDocument fallback"
            fi

            echo "=== CONFIGURING TTL FOR CRAWLER-FACING TEXT ASSETS ==="
            # robots.txt, the sitemaps and llms.txt inherit the Cloudways Nginx
            # "expires 1y" rule for static extensions. That let Cloudflare pin a stale
            # robots.txt at the edge for a year after it was updated. Exact-match
            # locations outrank regex locations in Nginx, so these take priority.
            if [ -d "$NGINX_CUSTOM_DIR" ]; then
              cat > "$NGINX_CUSTOM_DIR/custom_cache_rules.conf" << 'NGINX_EOF'
            # Armstrong Locksmith - short TTL for crawler-facing text assets.
            # These change on deploy and must not sit in an edge cache for a year.
            location = /robots.txt {
              expires off;
              add_header Cache-Control "public, max-age=300, s-maxage=300" always;
            }
            location = /llms.txt {
              expires off;
              add_header Cache-Control "public, max-age=300, s-maxage=300" always;
            }
            location = /sitemap-index.xml {
              expires off;
              add_header Cache-Control "public, max-age=300, s-maxage=300" always;
            }
            location = /sitemap-0.xml {
              expires off;
              add_header Cache-Control "public, max-age=300, s-maxage=300" always;
            }
            NGINX_EOF
              echo "Nginx text-asset cache TTL config written successfully"
            fi

            echo "=== PURGING LOCAL VARNISH CACHE ==="
            curl -s -X PURGE "http://127.0.0.1/" -H "Host: armstronglocksmithinc.com" || true
            curl -s -X BAN "http://127.0.0.1/.*" -H "Host: armstronglocksmithinc.com" || true

            # Attempt Nginx reload if available (Cloudways may require this)
            sudo nginx -t 2>/dev/null && sudo systemctl reload nginx 2>/dev/null && echo "Nginx reloaded" || echo "Nginx reload skipped (may need Cloudways panel)"

            echo "Website deploy complete!"
