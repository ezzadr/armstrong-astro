name: Auto Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudways Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            if [ -d "public_html" ]; then
              cd public_html
            elif [ -d "$HOME/public_html" ]; then
              cd "$HOME/public_html"
            fi
            echo "Deploying in directory: $(pwd)"
            git fetch origin main
            git reset --hard origin/main
            echo "Deployment completed successfully at $(date)!"
