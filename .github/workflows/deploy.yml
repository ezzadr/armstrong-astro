name: Auto Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudways Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            set -e
            git config --global --add safe.directory "*"
            cd /home/master/applications/btfdkcdpdw/public_html
            
            echo "=== CURRENT GIT STATUS ==="
            git fetch origin main
            git reset --hard origin/main
            git status
            
            echo "=== PURGING LOCAL VARNISH CACHE ==="
            curl -s -X PURGE "http://127.0.0.1/" -H "Host: armstronglocksmithinc.com" || true
            curl -s -X BAN "http://127.0.0.1/.*" -H "Host: armstronglocksmithinc.com" || true

            echo "=== INSPECTING LARAVEL APP 1: hrfzwcjvqh ==="
            cd /home/master/applications/hrfzwcjvqh/public_html 2>/dev/null || cd /home/master/applications/hrfzwcjvqh
            git remote -v || true
            git log -n 1 || true
            cat .env 2>/dev/null | grep -E "APP_NAME|APP_URL|TWILIO" || true

            echo "=== INSPECTING LARAVEL APP 2: jqkvdrpcfz ==="
            cd /home/master/applications/jqkvdrpcfz/public_html 2>/dev/null || cd /home/master/applications/jqkvdrpcfz
            git remote -v || true
            git log -n 1 || true
            cat .env 2>/dev/null | grep -E "APP_NAME|APP_URL|TWILIO" || true
