name: Auto Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudways Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            TARGET_DIR=""
            if [ -d "/home/master/applications/btfdkcdpdw/public_html" ]; then
              TARGET_DIR="/home/master/applications/btfdkcdpdw/public_html"
            elif [ -d "$HOME/applications/btfdkcdpdw/public_html" ]; then
              TARGET_DIR="$HOME/applications/btfdkcdpdw/public_html"
            elif [ -d "public_html" ]; then
              TARGET_DIR="$(pwd)/public_html"
            elif [ -d "$HOME/public_html" ]; then
              TARGET_DIR="$HOME/public_html"
            else
              TARGET_DIR=$(find /home/master/applications -name "public_html" 2>/dev/null | head -n 1)
            fi

            echo "=== TARGET DEPLOYMENT DIRECTORY: $TARGET_DIR ==="
            cd "$TARGET_DIR"
            git fetch origin main
            git reset --hard origin/main
            echo "=== DEPLOYMENT SUCCESSFUL AT $(date) ==="
