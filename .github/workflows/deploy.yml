name: Auto Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudways Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== SEARCHING VHOSTS FOR DOMAIN ==="
            grep -rn "armstronglocksmithinc.com" /home/master/applications/*/conf/ /etc/nginx/ /etc/apache2/ 2>/dev/null || true
            
            echo "=== LISTING ALL SITES IN /home/ ==="
            find /home/ -maxdepth 3 -name "public_html" 2>/dev/null
            
            echo "=== CHECKING VARNISH / NGINX CACHE ==="
            # Restart or reload Nginx / Apache cache if permissions allow
            killall -HUP nginx 2>/dev/null || true
            killall -HUP apache2 2>/dev/null || true
