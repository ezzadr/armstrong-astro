name: Auto Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudways Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            set -e
            git config --global --add safe.directory "*"
            
            echo "=== LISTING ALL APPLICATIONS ON SERVER ==="
            ls -la /home/master/applications/
            
            # Find all public_html directories
            for dir in /home/master/applications/*/public_html; do
              echo "--- Syncing directory: $dir ---"
              cd "$dir"
              if [ ! -d ".git" ]; then
                git init
                git remote add origin https://github.com/ezzadr/armstrong-astro.git 2>/dev/null || git remote set-url origin https://github.com/ezzadr/armstrong-astro.git
              else
                git remote set-url origin https://github.com/ezzadr/armstrong-astro.git 2>/dev/null || true
              fi
              git fetch origin main
              git reset --hard origin/main
              echo "Synced $dir successfully!"
            done

            # Purge Varnish cache if available
            echo "=== PURGING VARNISH CACHE ==="
            varnishadm "ban req.url ~ .*" || true
            
            echo "=== FULL DEPLOYMENT COMPLETE ==="
