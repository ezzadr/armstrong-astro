name: Auto Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudways Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            set -e
            git config --global --add safe.directory "*"
            cd /home/master/applications/btfdkcdpdw/public_html
            
            echo "=== CURRENT GIT STATUS ==="
            git fetch origin main
            git reset --hard origin/main
            git status
            
            echo "=== PURGING LOCAL VARNISH CACHE ==="
            curl -s -X PURGE "http://127.0.0.1/" -H "Host: armstronglocksmithinc.com" || true
            curl -s -X BAN "http://127.0.0.1/.*" -H "Host: armstronglocksmithinc.com" || true

            echo "=== CHECKING INDEX.HTML CONTENT ==="
            grep -n "Get Your Free Upfront Estimate" index.html || echo "NOT FOUND IN INDEX.HTML"
            grep -n "Instant Quote Request" index.html || echo "NOT FOUND IN INDEX.HTML"
            grep -n "15–25 minutes" index.html || echo "15-25 minutes NOT PRESENT (CLEANED)"
            
            echo "=== CHECKING PERMISSIONS ==="
            ls -la index.html
