name: Auto Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudways Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            set -e
            git config --global --add safe.directory "*"
            cd /home/1506337.cloudwaysapps.com/btfdkcdpdw/public_html || cd /home/master/applications/btfdkcdpdw/public_html
            echo "Current Directory: $(pwd)"
            git remote set-url origin https://github.com/ezzadr/armstrong-astro.git 2>/dev/null || git remote add origin https://github.com/ezzadr/armstrong-astro.git
            git fetch origin main
            git reset --hard origin/main
            echo "=== AUTO DEPLOYMENT SUCCESSFUL AT $(date) ==="
