name: Auto Deploy to Cloudways

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudways Live Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on Cloudways
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CLOUDWAYS_HOST }}
          username: ${{ secrets.CLOUDWAYS_USER }}
          password: ${{ secrets.CLOUDWAYS_PASSWORD }}
          key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== SEARCHING FOR APPLICATION ROOT ==="
            APP_PATH="/home/master/applications/btfdkcdpdw/public_html"
            
            if [ ! -d "$APP_PATH" ]; then
              APP_PATH=$(find /home/master/applications -maxdepth 2 -name "public_html" 2>/dev/null | head -n 1)
            fi
            
            echo "Target Directory: $APP_PATH"
            cd "$APP_PATH"
            
            if [ ! -d ".git" ]; then
              echo "Initializing Git repository in $APP_PATH..."
              git init
              git config --global --add safe.directory "$APP_PATH" || true
              git remote add origin https://github.com/ezzadr/armstrong-astro.git 2>/dev/null || git remote set-url origin https://github.com/ezzadr/armstrong-astro.git
            fi
            
            echo "Fetching latest main branch from GitHub..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "=== AUTO DEPLOYMENT LIVE & SYNCED SUCCESSFULLY AT $(date) ==="
